syntax = "proto3";

package grpc;

message Empty {}

message Point {
    float value = 2;
}

message PointIndex {
    int32 index = 1;
}

service Serve {
    rpc SendOne (Point) returns (Empty);
    rpc SendMore (stream Point) returns (Empty);
    rpc GetOne (PointIndex) returns (Point);
    rpc GetAll (Empty) returns (stream Point);
}